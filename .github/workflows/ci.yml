name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: linux-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_VERSION: '24.19.0'
      CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse successful PR verification after merge
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/policy.py reuse

      - name: Set up Node
        if: steps.reuse.outputs.run_full == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/config-conformance/package-lock.json

      - name: Set up the repository Rust toolchain
        if: steps.reuse.outputs.run_full == 'true'
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt

      - name: Restore Rust archives and compilation cache
        if: steps.reuse.outputs.run_full == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            target/
          key: linux-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Reject formatting and policy regressions before downloads
        if: steps.reuse.outputs.run_full == 'true'
        run: |
          cargo fmt --all -- --check
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/policy.py dependencies --base "$CI_BASE_SHA"

      - name: Set up Socket Firewall
        if: steps.reuse.outputs.run_full == 'true'
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: '1.15.4'

      - name: Fetch qualified locked dependencies through Socket
        if: steps.reuse.outputs.run_full == 'true'
        run: |
          set -euo pipefail
          sfw cargo fetch --locked
          (cd tools/config-conformance && sfw npm ci --ignore-scripts --no-audit --no-fund)

      - name: Verify the repository
        if: steps.reuse.outputs.run_full == 'true'
        run: bash scripts/ci/check.sh

      - name: Record the verified PR tree
        if: github.event_name == 'pull_request' && steps.reuse.outputs.run_full == 'true'
        run: python3 scripts/ci/policy.py receipt --output "$RUNNER_TEMP/ci-proof/receipt.json"

      - name: Retain the verification receipt
        if: github.event_name == 'pull_request' && steps.reuse.outputs.run_full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-receipt-${{ steps.reuse.outputs.tree }}
          path: ${{ runner.temp }}/ci-proof/receipt.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
