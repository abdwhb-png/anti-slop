[package]
name = "anti-slop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Evidence-based code review with replaceable analyzers and judges"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
globset = { version = "=0.4.20", default-features = false }
jsonc-parser = { version = "=0.34.0", default-features = false }
regex-automata = "=0.4.18"
schemars = { version = "=1.2.2", features = ["preserve_order"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
serde_toon_format = { version = "=0.2.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[profile.dev]
debug = 1
incremental = true

[dev-dependencies]
assert_cmd = "=2.2.2"
tempfile = "=3.27.0"
