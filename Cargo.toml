[package]
name = "anti-slop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Evidence-based code review with replaceable analyzers and judges"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[profile.dev]
debug = 1
incremental = true

[dev-dependencies]
assert_cmd = "=2.2.2"
tempfile = "=3.27.0"
